name: CI

# Tests run locally first (`npm run verify` before every push). GitHub runs them once a
# pull request is ready to merge: not on drafts, not on pushes to main (merged pull
# requests were already tested). Mark a pull request "Ready for review" to run this, or
# start it by hand.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One Linux job: each extra job pays for its own setup and `npm ci`. It runs in
  # Playwright's image, which has the browsers and their system libraries installed.
  # The tag must match @playwright/test in package-lock.json: bump both together (the
  # "Check the Playwright image" step fails otherwise). cross-os.yml runs the tests on
  # macOS and Windows by hand.
  ci:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check the Playwright image matches @playwright/test
        run: node scripts/check-playwright-image.mjs
      - run: npm run check
      - run: npm test
      - run: npm run test:browser
      - run: npm run build
      - run: npm run build:firefox
      - run: npm run build:check
      - run: npm run build:check-download
      - run: npm run test:manifest
      - run: npm run test:e2e
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - run: npm run zip
      - run: npm run zip:firefox
      - run: npx web-ext lint --source-dir .output/firefox-mv3
      - uses: actions/upload-artifact@v4
        with:
          name: lingo-zips
          path: .output/*.zip
          if-no-files-found: error
          # .output is a hidden directory, which upload-artifact skips by default
          include-hidden-files: true
