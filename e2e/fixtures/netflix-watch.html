<!doctype html>
<!--
  SYNTHETIC skeleton of a Netflix watch page (www.netflix.com/watch/<id>). Not captured
  from Netflix (it needs a login): modeled on public descriptions of the web player's
  DOM, with the class names and data-uia attributes Lingo looks for (see
  src/content/video/netflix/site.ts and docs/notes/netflix.md). The <style> block is not
  Netflix's: it only lays out a full-window player with a control bar at the bottom.
  The control bar is not here: as on netflix.com, it is built while the pointer moves
  and removed when it stops, by the fake player (tests/fake-netflix-player.ts).
  For E2E: serve it at https://www.netflix.com/watch/* with context.route.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netflix</title>
    <style>
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: Arial, sans-serif;
      }
      .watch-video {
        position: fixed;
        inset: 0;
      }
      .watch-video--player-view {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      [data-uia="player"],
      [data-videoid] {
        position: absolute;
        inset: 0;
      }
      video {
        width: 100%;
        height: 100%;
        background: #000;
      }
      .player-timedtext {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 15%;
        text-align: center;
        font-size: 32px;
        text-shadow: 0 0 4px #000;
      }
      [data-uia="controls-standard"] {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
      }
      /* The row with the left buttons, the title and the right buttons. */
      [data-uia="controls-standard"] > div > div > div:last-child {
        height: 96px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 24px;
      }
      [data-uia="controls-standard"] > div > div > div:last-child > div {
        display: flex;
        align-items: center;
      }
      [data-uia="controls-standard"] > div > div > div:last-child > div > div:empty {
        width: 8px;
      }
      [data-uia="video-title"] {
        flex: 1;
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      [data-uia="video-title"] h4 {
        margin: 0;
      }
      [data-uia^="control-"] {
        width: 48px;
        height: 48px;
        background: none;
        border: 0;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="appMountPoint">
      <div class="watch-video" data-uia="watch-video">
        <div
          class="watch-video--player-view"
          data-uia="watch-video-player-view-minimized"
        >
          <div data-uia="player">
            <div data-uia="video-canvas" data-videoid="80000001">
              <video playsinline></video>
            </div>
            <div class="player-timedtext">
              <div class="player-timedtext-text-container">
                <span>Netflix's own subtitle</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
